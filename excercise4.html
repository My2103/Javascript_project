<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function displayMyMessage1 (){
            alert("Hello");
        }

        function displayMyMessage2 (){
            alert("Have a nice day!");
        }
    </script>
</head>
<body>
    <h1>Click the button to see the message</h1>

    <form>
        <input type="button" name="button1" value="Click here first" onclick="displayMyMessage1()">
        <br><br>
        <input type="button" name="button2" value="Then click here" onclick="displayMyMessage2()">
    </form>
</body>
</html>
