<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    form {
        margin-bottom: 20px;
    }

    input[type="text"] {
        margin: 5px;
        padding: 5px;
    }

    button {
        padding: 5px 10px;
        cursor: pointer;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    table, th, td {
        border: 1px solid black;
    }

    th, td {
        padding: 10px;
        text-align: left;
    }

    #dataTable {
        display: none;
        /* rest of your styles */
    }   

    /* The Modal (background) */
    .modal {
    display: none; /* Hidden by default */
    position: fixed; /* Stay in place */
    z-index: 1; /* Sit on top */
    left: 0;
    top: 0;
    width: 100%; /* Full width */
    height: 100%; /* Full height */
    overflow: auto; /* Enable scroll if needed */
    background-color: rgb(0,0,0); /* Fallback color */
    background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
    }

    /* Modal Content/Box */
    .modal-content {
    background-color: #fefefe;
    margin: 15% auto; /* 15% from the top and centered */
    padding: 20px;
    border: 1px solid #888;
    width: 80%; /* Could be more or less, depending on screen size */
    }

    /* The Close Button */
    .close-btn {
    padding: 5px 20px;
    background-color: #f44336;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    display: block; /* Make the button a block element */
    margin: 20px auto; /* Auto margin for left and right */
    }


    </style>

    <script>
    function addData() {
        var name = document.getElementById('name').value;
        var age = document.getElementById('age').value;

        var table = document.getElementById('dataTable');
        table.style.display = "table"; // This will make the table visible

        var newRow = table.insertRow(-1);
        var cell1 = newRow.insertCell(0);
        var cell2 = newRow.insertCell(1);

        cell1.innerHTML = name;
        cell2.innerHTML = age;
    }

    function getToppings() {
    var name = document.getElementById('name').value;
    var age = document.getElementById('age').value;
  
    // Update modal content
    document.getElementById('infoName').textContent = `Name: ${name}`;
    document.getElementById('infoAge').textContent = `Age: ${age}`;
  
    var select = document.getElementById('toppings');
  
    // Clear previous toppings
    var toppingsList = document.getElementById('infoToppings');
    toppingsList.innerHTML = '';
  
    // Add selected toppings to the list
    Array.from(select.selectedOptions).forEach(option => {
    var li = document.createElement('li');
    li.textContent = option.value;
    toppingsList.appendChild(li);
  });
  
   // Display the modal
   var modal = document.getElementById('infoModal');
   modal.style.display = "block";
}

// Function to close the modal
function closeModal() {
   var modal = document.getElementById('infoModal');
   modal.style.display = "none";
}

</script>
</head>
<body>
    <form id="myForm">
        <input type="text" id="name" placeholder="Enter name">
        <input type="text" id="age" placeholder="Enter age">
        <select id="toppings" multiple>
            <option value="onion">Onion</option>
            <option value="chocolate">Chocolate</option>
            <option value="cheese">Cheese</option>
            <option value="butter">Butter</option>
            <option value="olive">Olive</option>
          </select>
        <button type="button" onclick="addData()">Submit</button>
        <button type="button" onclick="getToppings()">Get Toppings</button>
      </form>
      
        
      </div>

      <table id="dataTable">
        <tr>
          <th>Name</th>
          <th>Age</th>
        </tr>
      </table>

    <!-- Modal for displaying information -->
    <div id="infoModal" class="modal">
    <div class="modal-content">
      <h1>Information</h1>
      <p id="infoName">Name: </p>
      <p id="infoAge">Age: </p>
      <p>Topping:</p>
      <ul id="infoToppings" style="list-style-type:circle;">
        <!-- Toppings will be listed here -->
      </ul>
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>
  
  

</body>
</html>
