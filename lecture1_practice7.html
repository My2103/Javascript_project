<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <!--LAYOUT 1-->
    <h1>Layout 1</h1>
    <table border="1" width="100%">
        <tr>
            <td height="150">&nbsp</td>
        </tr>

        <tr>
            <td height="650">&nbsp</td>
        </tr>
    </table>
    
    <!--LAYOUT 2-->
    <h1>Layout 2</h1>
    <table border="1" width="100%" height="800">
        <tr>
            <td width="300">&nbsp</td>
            <td colspan="2">&nbsp</td>
        </tr>
    </table>

    <!--LAYOUT 3-->
    <h1>Layout 3</h1>
    <table border="1" width="100%" height="800">
        <tr>
            <td>&nbsp</td>
            <td>&nbsp</td>
        </tr>

        <tr>
            <td>&nbsp</td>
            <td>&nbsp</td>
        </tr>
    </table>

    <!--LAYOUT 4-->
    <h1>Layout 4</h1>
    <table border="1" width="100%">
        <tr>
            <td rowspan="2" width="400">&nbsp</td>
            <td>&nbsp</td>
        </tr>

        <tr>
            <td>&nbsp</td>
        </tr>
    </table>

    <table border="1" width="100%">
        <tr>
            <td width="500">&nbsp</td>
            <td rowspan="2" height="300">&nbsp</td>
        </tr>

        <tr>
            <td>&nbsp</td>
        </tr>

        <tr>
            <td colspan="2" height="50">&nbsp</td>
        </tr>
    </table>

    <!--LAYOUT 5-->
    <h1>Layout 5</h1>
    <table border="1" width="100%">
        <tr>
            <td colspan="2" height="50">&nbsp</td>
        </tr>

        <tr>
            <td width="100" height="400">&nbsp</td>
            <td>&nbsp</td>
        </tr>

        <tr>
            <td colspan="2" height="50">&nbsp</td>
        </tr>
    </table>

    <!--LAYOUT 6-->
    <h1>Layout 6</h1>
    <table border="1" width="100%">
        <tr>
            <td width="100" height="50">&nbsp</td>
            <td>&nbsp</td>
        </tr>

        <tr>
            <td colspan="2" height="500">&nbsp</td>
        </tr>

        <tr>
            <td colspan="2" height="50">&nbsp</td>
        </tr>

    </table>
</body>
</html>
