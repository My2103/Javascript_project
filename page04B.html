<!DOCTYPE html> <html>
<!-- File: page04B.html Creation: 2019-10-02
Description: Page Layout -->
<head>
<title>Page Layout</title> 
<style>
article{
    display:grid;
    grid-template-rows:100px 50px auto 50px; 
    grid-template-columns: auto 800px 200px auto; 
    grid-template-areas: ". header header ." 
                         ". nav nav ." 
                         ". content ads ." 
                         ". footer footer .";
} 
header { 
    grid-area: header; 
    background-color: blue; 
} 
nav { 
    grid-area: nav; 
    background-color: green; 
} 
section { 
    grid-area: content; 
    background-color: yellow; 
} 
aside { 
    grid-area: ads; 
    background-color: orange; 
} 
footer { 
    grid-area: footer; 
    background-color: blue; 
} 
</style>
</head> 
<body>
<article>
<header> </header> <nav> </nav> <section>this is some content </section>
<aside>hello </aside> <footer> </footer>
</article> 
</body>
</html>
