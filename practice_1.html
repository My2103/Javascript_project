<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function planeChoice152(){
            var planeDescription152 = "A small two-place airplane for flight training";
            alert(planeDescription152);
        }

        function planeChoice172(){
            var planeDescription172 = "The smaller of two four-place airplanes";
            alert(planeDescription172);
        }

        function planeChoice182() {
            var planeDescription182 = "The larger of two four-place airplanes";
            alert(planeDescription182);
        }

        function planeChoice210(){
            var planeDescription210 = "A six-place high-performance airplane";
            alert(planeDescription210);
        }
    </script>
</head>
<body>
    <h4>Cessna single-engine airplane descriptions</h4>
    <input type="radio" id="152" name="planeButton" value="152" onclick="planeChoice152()">
    <label for="152">Model 152</label>
    <br>
    <input type="radio" id="172" name="planeButton" value="172" onclick="planeChoice172()">
    <label for="172">Model 172 (Skyhawk)</label>
    <br>
    <input type="radio" id="182" name="planeButton" value="182" onclick="planeChoice182()">
    <label for="182">Model 182 (Skylane)</label>
    <br>
    <input type="radio" id="210" name="planeButton" value="210" onclick="planeChoice210()">
    <label for="210">Model 210 (Centurian)</label>

</body>
</html>
