<!DOCTYPE html>
<html lang="en">
<head>
    <title>Practice 1</title>  
</head>
<body>
    <h1>Hello World</h1>
    <p align="center">Bold Text - h2 - center:</p>
    <b><h2 align="center">Your name</h2></b>
    <p align="right">Strong Text - h3 - right:</p>
    <strong><h3 align="right">Your name</h3></strong>
    <p>Italic Text - h4 - left:</p>
    <i><h4>Your name</h4></i>
    <p>Underline Text - h5:</p>
    <ins><h5>Your name</h5></ins>
</body>
</html>
