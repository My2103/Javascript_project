<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function Submit() {
        // Get the form element
        const form = document.querySelector('form');

        // Prevent the default form submission behavior
        form.addEventListener('submit', function (event) {
            event.preventDefault();

            // Display the success message
            const successMessage = document.createElement('p');
            successMessage.textContent = 'Successful login';
            successMessage.style.textAlign = 'center';
            document.body.appendChild(successMessage);
        });
    }
</script>
<style>
    #sign_in_container{
        display: flex;
        flex-direction: row;
        justify-content: center;
    }

    #description{
        margin-right: 30px;
    }

    #picture{
        margin-right: 30px;
    }

    #form{
        margin-top: 60px;
        padding: 50px;
        border-style: outset;
        background-image: linear-gradient(to right, white, silver, white);
    }
</style>
<body>
    <div id="sign_in_container">
        <div id="description">
            <span style="font-size: 50px;">&#9733</span>
            <h1 style="margin-bottom: 0.0em;">Become a little star <br> in book universe</h1>
            <p style="font-size: 28px; margin: 0.0em 0.0em 0.0em 0.0em;">Free to explore</p>
            <ul>
                <li>Explore book in the whole universe</li>
                <li>Set bookmark</li>
                <li>Save the favorite book</li>
                <li>Save the favorite page</li>
                <li>Transcribe the quotes</li>
                <li>Connect to readers community</li>
            </ul>
        </div>
        <div id="picture">
            <img src="book_icon.png" alt="icon of book" style="width: 400px; height: 400px;">
        </div>
        <div id="form">
            <form action="">
                <h2>Sign in</h2>
                <input type="text" id="email" placeholder="Email" required>
                <br><br>
                <input type="password" id="password" placeholder="Password" required>
                <br><br>
                <input type="text" id="fname" placeholder="First name" required>
                <br><br>
                <input type="text" name="lname" id="lname" placeholder="Last name" required>
                <br><br>
                <input type="submit" onclick="Submit()">
            </form>
        </div>
    </div>
</html>
