<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML_Practice_3</title>
</head>
<body>
    <h1>Unordered List</h1>
    <b><p>Things cat loves:</p></b>

    <ul type="disc">
        <li>milk</li>
        <li>cheese</li>
    </ul>

    <ul type="square">
        <li>milk</li>
        <li>cheese</li>
    </ul>

    <ul type="circle">
        <li>milk</li>
        <li>cheese</li>
    </ul>

    <h1>Ordered List</h1>
    <b><p>Things cat loves:</p></b>

    <ol>
        <li>milk</li>
        <li>cheese</li>
    </ol>

    <ol>
        <li type="a">milk</li>
        <li type="a">cheese</li>
    </ol>

    <ol>
        <li type="A">milk</li>
        <li type="A">cheese</li>
    </ol>

    <ol>
        <li type="I">milk</li>
        <li type="I">cheese</li>
    </ol>

    <ol>
        <li type="i">milk</li>
        <li type="i">cheese</li>
        
    </ol>
    
</body>
</html>
