<!DOCTYPE html> 
<html lang="en-GB"> 
    <head>
        <title>Drop-down Menu</title> 
    </head>

    <style>
        select[name="browser"]{
            width: 10em;
            font-size: 18px;
            background-color: lightblue;
        }

        select[name="browser"] option {
            background-color: lightblue; 
        }
    
    </style>
<body>
<h1>Drop-down Menu</h1>
<form action="https://cgi.csc.liv.ac.uk/~ullrich/COMP519/examples/process.php"> 
    <label>Select your favourite browser:</label>
<select name="browser" required>
<option value="" selected></option>
<option value="I">Internet Explorer</option> 
<option value="F">Firefox</option>
<option value="C">Chrome</option> 
<option value="O">Opera</option>
<option value="S">Safari</option>
</select>
<input type="submit" value="Submit"> 
</form> 
</body>
</html>
